name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/validate_docs.py
      - run: python -m pytest tests/test_docs_validation.py -q -p no:cacheprovider
        working-directory: backend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest tests -q -p no:cacheprovider
        working-directory: backend
      - name: Independent committed-example verification and dependency consistency
        run: |
          python -m app.sandbox.verify_manifest ../docs/examples/sandbox/experiment.json
          python -m app.sandbox.verify_experiment ../docs/examples/sandbox/forkcast.json
          python -m pip check
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run validate:assets
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node --test scripts/graphics-report.test.mjs
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Fresh-process offline release journey
        run: python scripts/release-smoke.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test public read-only container
        run: python scripts/container-smoke.py --image pulse-xi:ci
  deployment-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile deployment template without Azure credentials or resource access
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: az bicep build --file infra/azure/main.bicep --stdout > "$GITHUB_WORKSPACE/main.generated.json"
      - name: Verify prepared workflow is manual and non-PR scoped
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/deploy-azure.yml').read_text()
          assert 'workflow_dispatch:' in workflow
          assert '\n  pull_request:' not in workflow
          assert "if: github.ref == 'refs/heads/main'" in workflow
          assert 'id-token: write' in workflow
